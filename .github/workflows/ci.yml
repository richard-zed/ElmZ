name: ci

on:
  push:
  pull_request:

jobs:
  zig:
    strategy:
     fail-fast: false
     matrix:
       include:
        - zig: "0.16.0"
          os: ubuntu-latest
        - zig: "0.17.0"
          os: ubuntu-latest
        - zig: "0.16.0"
          os: ubuntu-24.04-arm
        - zig: "0.17.0"
          os: ubuntu-24.04-arm
        - zig: "0.16.0"
          os: windows-latest
        - zig: "0.17.0"
          os: windows-latest

    runs-on: ${{ matrix.os }}
      
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig }}
      - run: zig fmt --check build.zig src test bench
      # `zig build test` never touches the configure phase or the examples,
      # which is exactly where an install-path break hid for a whole release.
      - run: zig build --summary all
      - run: zig build test --summary all

    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
      - run: zig build fuzz -Dfont=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf --summary all
      - run: zig build bench -Doptimize=ReleaseFast -Dfont=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
