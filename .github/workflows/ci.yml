name: ci

on:
  push:
  pull_request:

jobs:
  zig:
    strategy:
      fail-fast: false
      matrix:
        zig: ["0.17.0"]
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig }}
      - run: zig fmt --check build.zig src tests examples
      # `zig build test` never touches the configure phase or the examples,
      # which is exactly where an install-path break hid for a whole release.
      - run: zig build --summary all
      - run: zig build test --summary all